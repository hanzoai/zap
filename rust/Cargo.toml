[package]
name = "zapwire"
version = "1.0.0"
edition = "2021"
description = "ZAP — Zero-copy Application Protocol. Wire-compatible with github.com/zap-proto/go: message codec, RPC envelope with promise pipelining, and a client/server transport."
license = "MIT"
repository = "https://github.com/hanzoai/zap"
keywords = ["zap", "rpc", "binary-protocol", "zero-copy"]
categories = ["network-programming", "encoding"]

# `zapwire` is the ZAP WIRE RUNTIME: header, data segment, call
# envelope, transport. The name is deliberate — every shorter one in the
# family already belongs to a different codebase, and one name must mean
# one thing:
#   zap         — an unrelated crates.io project
#   hanzo-zap   — hanzo/net/hanzo-zap, published 0.6.75, pinned by
#                 hanzo-node and the engine forks
#   zap-proto   — a reservation OWNED AND PUBLISHED by zap-proto/spec
#                 (see its reserve/zap-proto + release.yml), pointing at
#   zap-schema  — the schema compiler, whose lib is also imported as `zap`
#
# Schema-generated readers/writers come from our own zapc compiler
# (path = ../zapc-rs) — no upstream Cap'n Proto dependency.

[dependencies]
tokio        = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
async-trait  = "0.1"
thiserror    = "2"

[build-dependencies]
# Both a path AND a version: the path is what the workspace builds
# against, the version is what a published `zapwire` resolves from
# crates.io. Without the version `cargo publish` refuses the manifest
# outright, which is why the rename could not actually ship before.
zapc = { path = "../zapc-rs", version = "1.0.0" }

[dev-dependencies]
tokio    = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "wire"
harness = false

[lib]
name = "zapwire"
path = "src/lib.rs"
