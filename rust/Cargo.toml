[package]
name = "zap-proto"
version = "1.0.1"
edition = "2021"
description = "ZAP — Zero-copy Application Protocol. Wire-compatible with github.com/zap-proto/go: message codec, RPC envelope with promise pipelining, and a client/server transport."
license = "MIT"
repository = "https://github.com/hanzoai/zap"
keywords = ["zap", "rpc", "binary-protocol", "zero-copy"]
categories = ["network-programming", "encoding"]

# Published as `zap-proto`, imported as `zap` — the same split the Go
# module has (github.com/zap-proto/go, package zap). The crates.io name
# `zap` belongs to an unrelated project, and `hanzo-zap` belongs to a
# DIFFERENT codebase (hanzo/net/hanzo-zap, published 0.6.75, pinned by
# hanzo-node and the engine forks). One name, one codebase — so this
# one does not take a name another codebase already publishes.
#
# Schema-generated readers/writers come from our own zapc compiler
# (path = ../zapc-rs) — no upstream Cap'n Proto dependency.

[dependencies]
tokio        = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
async-trait  = "0.1"
thiserror    = "2"

[build-dependencies]
zapc = { path = "../zapc-rs" }

[dev-dependencies]
tokio    = { version = "1", features = ["full", "test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "wire"
harness = false

[lib]
name = "zap"
path = "src/lib.rs"
