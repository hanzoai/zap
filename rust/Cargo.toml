[workspace]

[package]
name = "hanzo-zap"
version = "1.0.1"
edition = "2021"
description = "ZAP — Zero-copy Application Protocol. Binary RPC with capnp segments and ZAP framing."
license = "MIT"
repository = "https://github.com/hanzoai/zap"
keywords = ["zap", "rpc", "binary-protocol", "capnproto", "zero-copy"]
categories = ["network-programming", "encoding"]

# Earlier 1.0.0 of this crate was a JSON-payload-in-binary-frame
# WebSocket prototype that never shipped. 1.0.1 is the canonical
# Cap'n-Proto-style zero-copy binary protocol matching the on-wire
# format of github.com/luxfi/zap (Go) and @zap-proto/zap (TS).

[dependencies]
# Cap'n Proto runtime — zero-copy reader/builder for the data segment.
# The ZAP wire format wraps capnp segments inside our 16-byte header.
capnp        = { version = "0.20", default-features = false, features = ["alloc"] }
capnp-futures = "0.20"

tokio        = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "signal", "time"] }
futures-util = "0.3"
async-trait  = "0.1"
log          = "0.4"
anyhow       = "1.0"
thiserror    = "2"

env_logger = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[build-dependencies]
capnpc = "0.20"

[[bin]]
name = "hanzo-zap"
path = "src/main.rs"

[lib]
name = "hanzo_zap"
path = "src/lib.rs"
