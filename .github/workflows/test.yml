name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Go is not optional here: rust/tests/interop.rs drives a real Go
      # ZAP peer, and without a toolchain that test SKIPS — which would
      # make the cross-language proof silently stop running.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: make test
